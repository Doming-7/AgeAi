<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css" />
    <title>Age Ai</title>
  </head>
  <body>
    <div class="age-card text-center">
      <h1 class="display-6 fw-bold text-primary mb-3">Age Ai</h1>
      <p class="text-muted">Enter your age below to get started.</p>

      <div class="mb-3 text-start">
        <label for="myText" class="form-label fw-semibold">Your Age</label>
        <input
          type="number"
          class="form-control form-control-lg"
          id="myText"
          placeholder="e.g. 25"
        />
      </div>

      <button
        type="button"
        class="btn btn-primary btn-lg w-100 mb-4"
        id="myButton"
      >
        Submit Age
      </button>

      <div class="mt-3">
        <h3 id="myH3" class="h4 text-secondary"></h3>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
